/* --- State --- */
var state = { /* ... as before ... */ };

  enabled: false,

/* --- AI Mode Toggle: just a switch, no modal --- */
ui.aiModeBtn.addEventListener('click', function(){
  if(!aiState.enabled){
    aiState.enabled = true;
    ui.aiModeBtn.classList.add('active');
    ui.aiModeBtn.innerHTML = '<div class="ai-dot"></div> 🤖 AI Questions: ON';
    ui.aiStatusDot.classList.add('on');
    ui.aiStatusMsg.innerHTML = '<strong>AI Mode ON!</strong> Questions are generated by AI — infinite variety, tuned to your grade level.';
  } else {
    aiState.enabled = false;
    ui.aiModeBtn.classList.remove('active');
    ui.aiModeBtn.innerHTML = '<div class="ai-dot"></div> 🤖 AI Questions: OFF';
    ui.aiStatusDot.classList.remove('on');
    ui.aiStatusMsg.innerHTML = 'Turn on <strong>AI Questions</strong> for infinite, unique questions generated just for you!';
  }
});

/* --- AI: Proxy API --- */
async function callAIProxy(systemPrompt, userPrompt){
  var controller = new AbortController();
  var timeout = setTimeout(function(){ controller.abort(); }, 20000);
  try {
    var response = await fetch('/api/ai', {
      method: 'POST',
      signal: controller.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ systemPrompt: systemPrompt, userPrompt: userPrompt })
    });
    clearTimeout(timeout);
    if(!response.ok){
      var err = await response.json().catch(() => ({}));
      throw new Error((err.error) || ("API error " + response.status));
    }
    var data = await response.json();
    return data.response;
  } catch (e) {
    clearTimeout(timeout);
    if(e.name === 'AbortError') throw new Error('Request timed out. Check your internet connection.');
    throw e;
  }
}

/* --- Generate AI Question via backend --- */
async function generateAIQuestion(){
  var gradeText = getGradeText();
  var diff = getCurrentDifficulty();
  // For nonverbal mode, fallback to built-in
  var aiMode = state.mode;
  if(aiMode === 'nonverbal'){
    var q = genNonverbal(diff);
    q._fallback = true;
    return q;
  }
  var questionType;
  if(aiMode === 'verbal') questionType = 'verbal';
  else if(aiMode === 'quant') questionType = 'quantitative (number patterns, word problems, sequences)';
  else questionType = Math.random() < 0.5 ? 'verbal' : 'quantitative (number patterns, word problems, sequences)';
  var systemPrompt = 'You generate CogAT practice questions. Always respond with ONLY valid JSON and nothing else — no markdown, no backticks, no explanation. The JSON must have exactly these fields: type (string: "verbal" or "quant"), q (string: the question), options (array of exactly 4 strings), answer (string: must exactly match one element of options), hint (string: a short helpful hint without giving away the answer).';
  var userPrompt = 'Generate a ' + diff + ' difficulty CogAT ' + questionType + ' question for a ' + gradeText + ' student. '
    + 'For verbal: use analogies ("A is to B as C is to ___"), synonyms, antonyms, or sentence completion. '
    + 'For quantitative: use number sequences, arithmetic word problems, or pattern recognition. '
    + 'Make sure all 4 options are plausible but only one is correct. '
    + 'The answer must exactly match one of the options. Return only JSON.';
  var text = await callAIProxy(systemPrompt, userPrompt);
  // Strip accidental markdown fences
  text = text.replace(/^```json\s*/,'').replace(/^```\s*/,'').replace(/\s*```$/,'');
  var parsed = JSON.parse(text);
  if(parsed.options.indexOf(parsed.answer) === -1){
    parsed.options[0] = parsed.answer;
    parsed.options = shuffle(parsed.options);
  }
  parsed.id = 'ai_' + Date.now();
  parsed._isAI = true;
  return parsed;
}

/* --- AI: Get Explanation via backend --- */
async function getAIExplanation(){
  if(aiState.loading) return;
  aiState.loading = true;

  ui.explainBtn.disabled = true;
  ui.explainBtn.textContent = '🤖 Thinking...';
  ui.aiExplanation.style.display = 'block';
  ui.aiExplanationText.className = 'ai-explanation-body loading';
  ui.aiExplanationText.innerHTML = 'Thinking<span class="loading-dots"></span>';

  var gradeText = getGradeText();
  var q = state.currentQuestion;
  try {
    var explanation = await callAIProxy(
      'You are a friendly tutor helping a child prepare for the CogAT test. Explain answers in a warm, encouraging, simple way. Be brief (2-4 sentences max). End with an uplifting note.',
      'A ' + gradeText + ' student is practicing for the CogAT. They got this question wrong:\n\nQuestion: ' + q.q + '\nCorrect answer: ' + q.answer + '\n\nExplain in simple, kind language why "' + q.answer + '" is the right answer. Keep it short and encouraging!'
    );
    ui.aiExplanationText.className = 'ai-explanation-body';
    ui.aiExplanationText.textContent = explanation;
    ui.explainBtn.style.display = 'none';
    aiState.explanationsGiven += 1;
    ui.aiExplainCount.textContent = aiState.explanationsGiven;
  } catch(err) {
    ui.aiExplanationText.className = 'ai-explanation-body';
    ui.aiExplanationText.textContent = '⚠️ ' + (err.message || 'Could not load explanation. Try again!');
    ui.explainBtn.disabled = false;
    ui.explainBtn.textContent = '🤖 Why is this the answer?';
  }
  aiState.loading = false;
}
